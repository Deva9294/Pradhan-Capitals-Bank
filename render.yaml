databases:
  - name: pradhan-capitals-db
    databaseName: pradhan_capitals
    user: pradhan_capitals_user
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: pradhan-capitals-bank
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pradhan-capitals-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
