services:
  - type: web
    name: pradhan-capitals-bank
    runtime: node
    plan: free
    # Keep these commands explicit for the existing Render service configuration.
    buildCommand: yarn install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pradhan_capitals
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
